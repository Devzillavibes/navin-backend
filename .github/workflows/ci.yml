name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check path filters
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'docker-compose.override.yml'
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'

  verify:
    name: Deps audit · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci

      - name: Check for undeclared dependencies
        run: npm run check:deps

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  openapi-lint:
    name: OpenAPI Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci

      - name: Run OpenAPI Lint
        run: npm run lint:openapi

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: changes
    # Always verify the image on main pushes; path-filter only on PRs
    if: github.event_name == 'push' || needs.changes.outputs.docker == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          provenance: false # verification-only build; re-enable when publishing to a registry
          tags: navin-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: changes
    # Run on main pushes and when docker-related files change on PRs
    if: github.event_name == 'push' || needs.changes.outputs.docker == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Validate compose files
        run: docker compose -f docker-compose.yml config -q

      - name: Bring up stack (production profile, no override)
        run: |
          docker compose -f docker-compose.yml up -d --build
          echo "Stack started; waiting for API health..."

      - name: Wait for /api/health to return 200
        run: |
          set +e
          ATTEMPTS=60
          for i in $(seq 1 $ATTEMPTS); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy (200) after $i attempts"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become healthy within $((ATTEMPTS*2)) seconds (last status: ${STATUS:-unknown})"
          set -e

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== docker compose ps ==="
          docker compose -f docker-compose.yml ps
          echo "=== app logs ==="
          docker compose -f docker-compose.yml logs app || true
          echo "=== stellar-worker logs ==="
          docker compose -f docker-compose.yml logs stellar-worker || true
          echo "=== stellar-indexer logs ==="
          docker compose -f docker-compose.yml logs stellar-indexer || true
          echo "=== mongo logs ==="
          docker compose -f docker-compose.yml logs mongo || true
          echo "=== redis logs ==="
          docker compose -f docker-compose.yml logs redis || true

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v --remove-orphans
